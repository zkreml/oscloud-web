<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Usměvavý obláček OSCloud">
  <defs>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55B6F2"/>
      <stop offset="1" stop-color="#1676D2"/>
    </linearGradient>
    <linearGradient id="cloudShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- stín pod obláčkem -->
  <ellipse cx="262" cy="362" rx="150" ry="16" fill="#081E34" opacity=".08"/>

  <!-- obláček -->
  <path d="M138 300c-46 0-80-33-80-76 0-40 30-72 70-76 10-58 60-100 120-100 52 0 96 31 114 78 6-1 12-2 18-2 50 0 88 40 88 89 0 49-38 87-88 87H138Z" fill="url(#cloudFill)"/>
  <path d="M150 170c12-52 56-86 106-86 40 0 74 20 92 52-30-20-70-28-110-20-36 8-66 26-88 54Z" fill="url(#cloudShine)"/>

  <!-- obličej -->
  <path d="M212 206c6-10 22-10 28 0" fill="none" stroke="#081E34" stroke-width="9" stroke-linecap="round"/>
  <path d="M300 206c6-10 22-10 28 0" fill="none" stroke="#081E34" stroke-width="9" stroke-linecap="round"/>
  <path d="M238 238c18 22 46 22 64 0" fill="none" stroke="#081E34" stroke-width="9" stroke-linecap="round"/>
  <circle cx="196" cy="236" r="13" fill="#FF9FB2" opacity=".55"/>
  <circle cx="344" cy="236" r="13" fill="#FF9FB2" opacity=".55"/>

  <!-- zámek (soukromí) -->
  <g transform="translate(404 70) rotate(10)">
    <rect x="-30" y="-6" width="60" height="50" rx="12" fill="#1B1F6B"/>
    <path d="M-17-6v-12a17 17 0 0 1 34 0v12" fill="none" stroke="#1B1F6B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="7" fill="#DDF2FF"/>
    <path d="M0 18v12" stroke="#DDF2FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- srdíčko -->
  <path transform="translate(74 92) rotate(-12)" d="M0 10c0-12 16-18 24-6 8-12 24-6 24 6 0 16-24 28-24 28S0 26 0 10Z" fill="#1B1F6B"/>

  <!-- jiskřičky -->
  <g fill="#55B6F2">
    <path d="M470 220l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
    <path d="M40 270l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <path d="M210 20l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
